        dockItem(id)?.classList.add('running');
        // Once the live site loads, drop the placeholder screenshot so it can't show through a transparent page.
        el.querySelectorAll('iframe').forEach((f) => f.addEventListener('load', () => {
          f.classList.add('loaded');
          const screen = f.closest('.screen');
          if (screen) {
            screen.style.backgroundImage = 'none';
            screen.classList.add('live');
          }
        }, { once: true }));
        center(el, (cascade++ % 5) * 28 - 56);
        focusWindow(id);
        return el;
      }

      // startUrl only applies to the Baseless browser: the page its first tab opens on.
      function openProject(id, startUrl) {
        const p = projectById(id);
        if (!p) return;
        rememberRecent(id);
        // Baseless Chat is the desktop's web browser: the live site fills a large, resizable window.
        if (p.device === 'browser') {
          const el = openWindow({
            id: p.id,
            title: p.name,
            device: p.device,
            body: '<div class="browser-app"></div>',
          });
          if (!el) return;
          setupBrowserTabs(el, p, startUrl);
          if (!isCompact()) {
            const W = desktop.clientWidth, H = desktop.clientHeight - dockH();
            setRect(el, { left: 0, top: 0, width: Math.min(1280, W - 48), height: Math.min(860, H - 32) });
            center(el);
          }
          return;
        }
        const win = openWindow({
          id: p.id,
          title: p.name,
          device: p.device,
          body: `
            <div class="window-body">
              ${deviceHTML(p)}
              <div class="info">
                <div class="head">
                  ${iconHTML(p.id)}
                  <div><h2>${p.name}</h2><span class="platform">${p.platform}</span>${p.stage ? `<span class="stage-badge-inline"><span class="badge stage">${p.stage === 'alpha' ? 'α' : 'β'}</span>${p.stage === 'alpha' ? 'Alpha' : 'Beta'}</span>` : ''}</div>
                </div>
                <p>${p.desc}</p>
                ${p.device === 'phone' ? '<div class="live">Live — tap and scroll inside the phone</div>' : ''}
                ${p.device === 'phone'
                  ? '<button class="btn" type="button" data-open-baseless>Open in Baseless ↗</button>'
                  : `<a class="btn" href="${p.url}" target="_blank" rel="noreferrer">${p.cta} ↗</a>`}
              </div>
            </div>`,
        });
        // Sites that load in a frame open in the Baseless browser (a new tab there), not a real browser tab.
        win?.querySelector('[data-open-baseless]')?.addEventListener('click', () => openInBaseless(p.url));
      }

      // Opens a site in the Baseless browser window as a new tab, opening the window first if needed.
      function openInBaseless(siteUrl) {
        const browser = projectById('baseless');
        const src = `${browser.url}/?url=${siteUrl.replace(/^https:\/\//, '').replace(/\/$/, '')}`;
        const win = windows.get(browser.id);
        if (!win) return openProject(browser.id, src);
        if (win.classList.contains('minimized')) restoreWindow(browser.id);
        else focusWindow(browser.id);
        bounce(browser.id);
        win.addBrowserTab(src);
      }

      // ---------- Browser tabs (Baseless Chat window) ----------
      // Tabs sit in the titlebar like Chrome. Each tab is its own live baseless.chat iframe; only the
      // active one is shown. baseless.chat is cross-origin, so tab labels can't read the page title.
      function setupBrowserTabs(win, p, startUrl) {
        const bar = win.querySelector('.titlebar');
        bar.classList.add('has-tabs');
        bar.querySelector('.title').hidden = true;
        bar.insertAdjacentHTML('beforeend', `
          <div class="tabs" role="tablist" aria-label="${p.name} tabs">
            <div class="tab-list"></div>
            <button type="button" class="tab-new" aria-label="New tab">+</button>
          </div>
          <button type="button" class="tab-menu" aria-label="Customize and control ${p.name}" title="Customize and control ${p.name}" aria-haspopup="menu">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="5.5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="18.5" r="1.6"/></svg>
          </button>`);
        const list = bar.querySelector('.tab-list');
        const app = win.querySelector('.browser-app');
        let seq = 0;

        const activate = (tabId) => {
          list.querySelectorAll('.tab').forEach((t) => t.setAttribute('aria-selected', t.dataset.tab === tabId));
          app.querySelectorAll('iframe').forEach((f) => (f.hidden = f.dataset.tab !== tabId));
          list.querySelector(`.tab[data-tab="${tabId}"]`)?.scrollIntoView({ block: 'nearest', inline: 'nearest' });
        };
        const addTab = (src = p.url) => {
          const tabId = 't' + ++seq;
          list.insertAdjacentHTML('beforeend', `
            <div class="tab" role="tab" data-tab="${tabId}" aria-selected="false">
              <span class="tab-ic" aria-hidden="true">${iconHTML('baseless')}</span>
              <span class="tab-label">baseless.chat</span>
              <button type="button" class="tab-close" aria-label="Close tab">×</button>
            </div>`);
          app.insertAdjacentHTML('beforeend',
            `<iframe data-tab="${tabId}" src="${src}" title="${p.name}" allow="clipboard-write; fullscreen; geolocation"></iframe>`);
          activate(tabId);
        };
        const closeTab = (tabId) => {
          const tab = list.querySelector(`[data-tab="${tabId}"]`);
          const wasActive = tab.getAttribute('aria-selected') === 'true';
          const neighbour = tab.nextElementSibling || tab.previousElementSibling;
          tab.remove();
          app.querySelector(`iframe[data-tab="${tabId}"]`).remove();
          if (!neighbour) return closeWindow(p.id); // last tab closes the window
          if (wasActive) activate(neighbour.dataset.tab);
        };

        // baseless.chat reports which site each tab is on (see reportPageToParent in its base.js).
        const origin = new URL(p.url).origin;
        const onPage = (e) => {
          if (e.origin !== origin || e.data?.type !== 'baseless.chat.page') return;
          const frame = [...app.querySelectorAll('iframe')].find((f) => f.contentWindow === e.source);
          const tab = frame && list.querySelector(`.tab[data-tab="${frame.dataset.tab}"]`);
          if (!tab) return;
          const title = String(e.data.title || 'baseless.chat').slice(0, 200);
          tab.querySelector('.tab-label').textContent = title;
          tab.title = title;
          // Remembered for the ⋮ menu (reload, copy link, open in a real tab).
          if (typeof e.data.url === 'string' && /^https?:\/\//.test(e.data.url)) frame.dataset.page = e.data.url;
        };
        window.addEventListener('message', onPage);
        // Stop listening once the window is gone.
        new MutationObserver((_, obs) => { if (!win.isConnected) { window.removeEventListener('message', onPage); obs.disconnect(); } })
          .observe(desktop, { childList: true });

        bar.querySelector('.tab-new').addEventListener('click', () => addTab());
        list.addEventListener('click', (e) => {
          const tab = e.target.closest('.tab');
          if (!tab) return;
          if (e.target.closest('.tab-close')) closeTab(tab.dataset.tab);
          else activate(tab.dataset.tab);
        });
        // Middle-click closes a tab, like a desktop browser.
        list.addEventListener('auxclick', (e) => { const tab = e.target.closest('.tab'); if (e.button === 1 && tab) closeTab(tab.dataset.tab); });
        win.addBrowserTab = addTab; // used by openInBaseless()

        // ⋮ menu at the right end of the titlebar: the browser's own menu, like Chrome's. It belongs to
        // this window, not to baseless.chat. Items a framed site can't support are listed but greyed out.
        const activeFrame = () => app.querySelector('iframe:not([hidden])');
        const activeTabId = () => activeFrame()?.dataset.tab;
        // The baseless.chat link for whatever the active tab is showing.
        const chatLink = (frame) => {
          const page = frame?.dataset.page;
          if (!page || new URL(page).origin === origin) return page || frame?.src || p.url;
          return `${p.url}/?url=${page.replace(/^https:\/\//, '').replace(/\/$/, '')}`;
        };
        const ZOOMS = [0.5, 0.67, 0.75, 0.8, 0.9, 1, 1.1, 1.25, 1.5, 1.75, 2];
        const setZoom = (frame, z) => {
          frame.dataset.zoom = z;
          // Scale the frame and give it the inverse size, so the page reflows at the new zoom and still fills the window.
          frame.style.transformOrigin = '0 0';
          frame.style.transform = z === 1 ? '' : `scale(${z})`;
          frame.style.width = frame.style.height = z === 1 ? '' : `${100 / z}%`;
          frame.style.flex = z === 1 ? '' : 'none';
        };
        const stepZoom = (dir) => {
          const frame = activeFrame();
          const z = Number(frame.dataset.zoom || 1);
          const i = ZOOMS.indexOf(z);
          setZoom(frame, ZOOMS[Math.min(ZOOMS.length - 1, Math.max(0, i + dir))]);
        };
        const menuButton = bar.querySelector('.tab-menu');
        const openTabMenu = () => {
          const frame = activeFrame();
          const zoom = Math.round(Number(frame?.dataset.zoom || 1) * 100);
          const items = [
            { key: 'newtab', label: 'New tab', kbd: '⌘T', action: true },
            { label: 'New window', kbd: '⌘N' },
            { label: 'New Incognito window', kbd: '⇧⌘N' },
            '-',
            { label: 'History', kbd: '⌘Y' },
            { label: 'Downloads', kbd: '⇧⌘J' },
            { label: 'Bookmarks and lists' },
            '-',
          ];
          const items2 = [
            '-',
            { key: 'reload', label: 'Reload', kbd: '⌘R', action: true },
            { key: 'copy', label: 'Copy link', action: Boolean(navigator.clipboard) },
            { key: 'real', label: 'Open in a real browser tab', action: true },
            { label: 'Print…', kbd: '⌘P' },
            { label: 'Find…', kbd: '⌘F' },
            '-',
            { key: 'extension', label: 'Get the Chrome extension', action: true },
            { key: 'privacy', label: 'Privacy policy', action: true },
            { key: 'terms', label: 'Terms of service', action: true },
            '-',
            { key: 'closetab', label: 'Close tab', kbd: '⌘W', action: true },
            { key: 'closewin', label: 'Close window', kbd: '⇧⌘W', action: true },
          ];
          const zoomRow = `
            <div class="menu-zoom">
              <span>Zoom</span>
              <button type="button" data-zoom="-1" aria-label="Zoom out"${zoom <= 50 ? ' disabled' : ''}>−</button>
              <output>${zoom}%</output>
              <button type="button" data-zoom="1" aria-label="Zoom in"${zoom >= 200 ? ' disabled' : ''}>+</button>
              <button type="button" data-zoom="full" aria-label="Full screen" title="Full screen">⛶</button>
            </div>`;
          const el = showPopover(menuButton, `<div role="menu" aria-label="${p.name} menu">${menuHTML(items)}${zoomRow}${menuHTML(items2)}</div>`, { className: 'menu tab-menu-pop', align: 'below' });
          if (!el) return;
          menuButton.setAttribute('aria-expanded', 'true');
          new MutationObserver((_, obs) => { if (!el.isConnected) { menuButton.setAttribute('aria-expanded', 'false'); obs.disconnect(); } })
            .observe(document.body, { childList: true });
          el.addEventListener('click', (e) => {
            const z = e.target.closest('[data-zoom]');
            if (z) {
              if (z.dataset.zoom === 'full') { closePopover(); toggleFullScreen(win); return; }
              stepZoom(Number(z.dataset.zoom));
              const now = Math.round(Number(activeFrame().dataset.zoom) * 100);
              el.querySelector('.menu-zoom output').textContent = now + '%';
              el.querySelector('[data-zoom="-1"]').disabled = now <= 50;
              el.querySelector('[data-zoom="1"]').disabled = now >= 200;
              return;
            }
            const btn = e.target.closest('.menu-item');
            if (!btn || btn.getAttribute('aria-disabled') === 'true') return;
            const act = btn.dataset.action;
            const current = activeFrame();
            closePopover();
            if (act === 'newtab') addTab();
            else if (act === 'reload') current.src = chatLink(current);
            else if (act === 'copy') navigator.clipboard.writeText(chatLink(current)).then(() => note('Link copied'), () => note("Couldn't copy the link"));
            else if (act === 'real') window.open(chatLink(current), '_blank', 'noopener');
            else if (act === 'extension') window.open('https://chromewebstore.google.com/detail/baselesschat/gcjiajedpobdppmhemiimclaidncgepk', '_blank', 'noopener');
            else if (act === 'privacy') addTab(`${p.url}/?url=baseless.chat/privacy_policy.html`);
            else if (act === 'terms') addTab(`${p.url}/?url=baseless.chat/terms_of_service.html`);
            else if (act === 'closetab') closeTab(activeTabId());
            else if (act === 'closewin') closeWindow(p.id);
          });
        };
        menuButton.addEventListener('click', openTabMenu);

        addTab(startUrl);
      }

      // ---------- Recent items ----------
      let recent = store.get('recent', []).filter(projectById);
      function rememberRecent(id) {
        recent = [id, ...recent.filter((r) => r !== id)].slice(0, 5);
        store.set('recent', recent);
      }

      // ---------- System windows ----------
      function openAbout() {
        openWindow({
          id: 'about',
          title: 'About altbryson',
          body: `
            <div class="about">
              ${iconHTML('altbryson')}
              <h2>altbryson</h2>
              <div class="ver">Version 2026.10</div>
              <dl>
                <dt>Owner</dt><dd>Bryson</dd>
                <dt>Projects</dt><dd>${PROJECTS.length} apps, games, and tools</dd>
                <dt>Platforms</dt><dd>Mobile web, Windows, Chrome</dd>
                <dt>Hosted on</dt><dd>Firebase</dd>
              </dl>
              <div class="row">
                <a class="btn secondary" href="https://www.linkedin.com/in/brysonwf/" target="_blank" rel="noreferrer">LinkedIn</a>
                <a class="btn secondary" href="https://x.com/brysonwf" target="_blank" rel="noreferrer">X</a>
              </div>
            </div>`,
        });
      }

      const WALLPAPERS = [
        { id: 'aurora', name: 'Aurora', css: 'linear-gradient(160deg,#312e81,#4338ca 40%,#6d28d9)' },
        { id: 'sunset', name: 'Sunset', css: 'linear-gradient(170deg,#7c2d12,#be185d 55%,#4c1d95)' },
        { id: 'ocean', name: 'Ocean', css: 'linear-gradient(165deg,#0c4a6e,#0e7490 50%,#134e4a)' },
        { id: 'graphite', name: 'Graphite', css: 'linear-gradient(170deg,#1e293b,#0f172a 60%,#020617)' },
      ];
      const settings = { wallpaper: store.get('wallpaper', 'aurora'), magnify: store.get('magnify', true) };
      document.body.dataset.wallpaper = settings.wallpaper;

      function openSettings() {
        const el = openWindow({
          id: 'settings',
          title: 'System Settings',
          body: `
            <div class="settings">
              <h3>Wallpaper</h3>
              <div class="swatches">
                ${WALLPAPERS.map((w) => `
                  <div>
                    <button class="swatch" type="button" data-wallpaper="${w.id}" style="background:${w.css}"
                      aria-pressed="${w.id === settings.wallpaper}" aria-label="${w.name} wallpaper"></button>
                    <span class="swatch-label">${w.name}</span>
                  </div>`).join('')}
              </div>
              <h3>Dock</h3>
              <div class="toggle-row">
                <span>Magnification</span>
                <button class="switch" type="button" role="switch" data-setting="magnify" aria-checked="${settings.magnify}" aria-label="Dock magnification"></button>
              </div>
            </div>`,
        });
        if (!el) return;
        el.addEventListener('click', (e) => {
          const sw = e.target.closest('.swatch');
          if (sw) {
            settings.wallpaper = sw.dataset.wallpaper;
            store.set('wallpaper', settings.wallpaper);
            document.body.dataset.wallpaper = settings.wallpaper;
            el.querySelectorAll('.swatch').forEach((s) => s.setAttribute('aria-pressed', s === sw));
          }
          const tg = e.target.closest('[data-setting="magnify"]');
          if (tg) {
            settings.magnify = !settings.magnify;
            store.set('magnify', settings.magnify);
            tg.setAttribute('aria-checked', settings.magnify);
          }
        });
      }

      // ---------- Popovers ----------
      let popover = null;
      let popoverOwner = null;

      function closePopover() {
        popover?.remove();
        popover = null;
        popoverOwner = null;
        document.body.classList.remove('popover-open');
      }

      // Shows `html` in a popover above `anchor` (or below it, right-aligned, with align: 'below').
      // Clicking the same anchor again toggles it.
      function showPopover(anchor, html, { className = '', align = 'center' } = {}) {
        if (popoverOwner === anchor) return closePopover();
        closePopover();
        popover = document.createElement('div');
        popover.className = `popover ${className}`;
        popover.innerHTML = html;
        document.body.appendChild(popover);
        popoverOwner = anchor;
        document.body.classList.add('popover-open');

        const a = anchor.getBoundingClientRect();
        const w = popover.offsetWidth;
        const dockTop = dock.getBoundingClientRect().top;
        let left = align === 'left' ? a.left - 6 : align === 'below' ? a.right - w : a.left + a.width / 2 - w / 2;
        left = Math.min(Math.max(8, left), window.innerWidth - w - 8);
        popover.style.left = left + 'px';
        if (align === 'below') {
          popover.style.top = a.bottom + 4 + 'px';
          popover.style.maxHeight = dockTop - a.bottom - 14 + 'px';
          popover.style.overflowY = 'auto';
        } else {
          popover.style.bottom = window.innerHeight - dockTop + 10 + 'px';
        }
        return popover;
      }

      document.addEventListener('pointerdown', (e) => {
        if (popover && !popover.contains(e.target) && !popoverOwner?.contains(e.target)) closePopover();
      });
      // Clicks inside a site frame never reach this page, but they take focus from it: close popovers then too.
      window.addEventListener('blur', () => { if (popover) closePopover(); });

      // ---------- altbryson menu (stands in for the Apple menu) ----------
      function menuHTML(items) {
        return items.map((it) => {
          if (it === '-') return '<div class="menu-sep" role="separator"></div>';
          const disabled = !it.action && !it.submenu;
          const sub = it.submenu
            ? `<span class="kbd">›</span><div class="submenu" role="menu">${menuHTML(it.submenu)}</div>`
            : it.kbd ? `<span class="kbd">${it.kbd}</span>` : '';
          // A submenu holds buttons, and buttons can't nest, so its parent row is a focusable div.
          const tag = it.submenu ? 'div tabindex="0"' : 'button type="button"';
          return `<${tag} role="menuitem" class="menu-item${it.submenu ? ' has-sub' : ''}"
            ${disabled ? 'aria-disabled="true"' : ''} data-action="${it.key || ''}">${esc(it.label)}${sub}</${it.submenu ? 'div' : 'button'}>`;
        }).join('');
      }

      function openSystemMenu(anchor) {
        const recentItems = recent.length
          ? recent.map((id) => ({ key: 'open:' + id, label: projectById(id).name, action: true }))
          : [{ label: 'No recent items' }];
        const items = [
          { key: 'about', label: 'About altbryson', action: true },
          '-',
          { key: 'settings', label: 'System Settings…', action: true },
          { label: 'App Store…' },
          '-',
          { label: 'Recent Items', submenu: recentItems },
          '-',
          { key: 'forcequit', label: 'Force Quit…', kbd: '⌥⌘⎋', action: windows.size > 0 },
          '-',
          { key: 'sleep', label: 'Sleep', action: true },
          { key: 'restart', label: 'Restart…', action: true },
          { key: 'shutdown', label: 'Shut Down…', action: true },
          '-',
          { key: 'lock', label: 'Lock Screen', kbd: '⌃⌘Q', action: true },
          { label: 'Log Out Bryson…', kbd: '⇧⌘Q' },
        ];
        // On small screens the tray icons are hidden from the dock and live at the top of this menu instead.
        const tray = isDockCompact()
          ? `<div class="menu-tray">${DOCK.filter((d) => d.tray && !d.compact).map((d) => `
              <button type="button" class="menu-tray-item" data-tray="${d.id}">
                ${iconHTML(d.id)}<span>${d.name.replace('Google Voice - ', '').replace('Spotlight ', '').replace('System ', '')}</span>
              </button>`).join('')}</div>`
          : '';
        const el = showPopover(anchor, `${tray}<div role="menu" aria-label="altbryson menu">${menuHTML(items)}</div>`, { className: 'menu', align: 'left' });
        if (!el) return;
        el.querySelectorAll('[data-tray]').forEach((b) => {
          const d = DOCK.find((x) => x.id === b.dataset.tray);
          if (d.badge) {
            b.dataset.unread = dockItem(d.id).dataset.unread;
            b.insertAdjacentHTML('beforeend', `<span class="badge">${dockItem(d.id).querySelector('.badge').textContent}</span>`);
          }
          b.addEventListener('click', () => { closePopover(); d.run(anchor); });
        });
        el.addEventListener('click', (e) => {
          const btn = e.target.closest('.menu-item');
          if (!btn || btn.getAttribute('aria-disabled') === 'true' || btn.classList.contains('has-sub')) return;
          const action = btn.dataset.action;
          closePopover();
          if (action === 'about') openAbout();
          else if (action === 'settings') openSettings();
          else if (action === 'forcequit') closeAllWindows();
          else if (action === 'sleep') sleep();
          else if (action === 'restart') restart();
          else if (action === 'shutdown') shutDown();
          else if (action === 'lock') lockScreen();
          else if (action.startsWith('open:')) openProject(action.slice(5));
        });
      }

      // ---------- Power states ----------
      function overlay(className, html, onDismiss) {
        const el = document.createElement('div');
        el.className = `overlay ${className}`;
        el.innerHTML = html;
        document.body.appendChild(el);
        if (onDismiss) {
          const dismiss = () => { el.remove(); onDismiss(); document.removeEventListener('keydown', dismiss); };
          setTimeout(() => {
            el.addEventListener('click', dismiss);
            document.addEventListener('keydown', dismiss);
          }, 400);
        }
        return el;
      }
      const bootHTML = `<div class="boot">${iconHTML('altbryson')}<div class="bar"><i></i></div></div>`;
      function sleep() { overlay('black', '<div class="hint">Sleeping. Click or press any key to wake.</div>', () => {}); }
      function restart() {
        closeAllWindows();
        const el = overlay('black', '');
        setTimeout(() => { el.innerHTML = bootHTML; }, 700);
        setTimeout(() => location.reload(), 2600);
      }
      function shutDown() {
        closeAllWindows();
        overlay('black', '<div><div class="hint">Click anywhere to power on.</div></div>', restart);
      }
      function lockScreen() {
        const now = new Date();
        overlay('lock', `
          <div>
            <div class="date">${now.toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric' })}</div>
            <div class="time">${now.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }).replace(/\s?[AP]M/i, '')}</div>
          </div>
          <div class="user"><div class="avatar">B</div><div>Bryson</div><div class="hint">Click to unlock</div></div>`, () => {});
      }

      // ---------- Status items ----------
      function updateClock() {
        const d = new Date();
        // The square tile stacks two-digit hours over minutes (08 / 10); AM/PM and the date are in the
        // hover label and popover. formatToParts avoids guessing each locale's separator.
        const parts = new Intl.DateTimeFormat([], { hour: '2-digit', minute: '2-digit' }).formatToParts(d);
        const part = (type) => parts.find((p) => p.type === type)?.value ?? '';
        document.querySelectorAll('.clk-h').forEach((n) => (n.textContent = part('hour').padStart(2, '0')));
        document.querySelectorAll('.clk-m').forEach((n) => (n.textContent = part('minute').padStart(2, '0')));
        const label = dockItem('clock')?.querySelector('.label');
        if (label) label.textContent = d.toLocaleString([], { weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
      }

      function clockPopover(anchor) {
        const d = new Date();
        showPopover(anchor, `
          <div class="big">${d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit', second: '2-digit' })}</div>
          <div class="sub">${d.toLocaleDateString([], { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })}</div>
          <div class="sub">${Intl.DateTimeFormat().resolvedOptions().timeZone.replace(/_/g, ' ')}</div>`);
      }

      // The desktop shows a fixed 42% battery rather than the visitor's own.
      const battery = { level: 0.42, charging: false, chargingTime: Infinity, dischargingTime: Infinity };
      function paintBattery() {
        if (!battery) return;
        const fill = document.querySelector('.icon-battery .bat-fill');
        const bolt = document.querySelector('.icon-battery .bat-bolt');
        // Vertical battery: the fill grows up from the bottom of the 34-unit-tall well.
        const h = Math.max(4, 34 * battery.level);
        fill.setAttribute('height', h);
        fill.setAttribute('y', 36 + 34 - h);
        fill.setAttribute('fill', battery.level < 0.2 && !battery.charging ? '#f87171' : '#fff');
        bolt.style.display = battery.charging ? '' : 'none';
        const label = dockItem('battery').querySelector('.label');
        label.textContent = `Battery ${Math.round(battery.level * 100)}%${battery.charging ? ' · Charging' : ''}`;
      }
      function batteryPopover(anchor) {
        showPopover(anchor, battery
          ? `<h4>Battery</h4><div class="big">${Math.round(battery.level * 100)}%</div>
             <div class="sub">${battery.charging ? 'Charging' : 'On battery power'}${
               battery.charging && isFinite(battery.chargingTime) ? ` · full in ${Math.round(battery.chargingTime / 60)} min` : ''}${
               !battery.charging && isFinite(battery.dischargingTime) ? ` · ${Math.round(battery.dischargingTime / 60)} min left` : ''}</div>`
          : `<h4>Battery</h4><div class="sub">This browser doesn't share battery details with websites.</div>`);
      }

      function paintWifi() {
        // Two of three bars: the outer arc is dimmed (all of them when offline).
        document.querySelectorAll('.icon-wifi .wifi-arcs path').forEach((arc, i) => {
          arc.style.opacity = !navigator.onLine || i === 0 ? 0.3 : 1;
        });
        const label = dockItem('wifi')?.querySelector('.label');
        if (label) label.textContent = navigator.onLine ? 'Wi-Fi · Connected' : 'Wi-Fi · Offline';
      }
      addEventListener('online', paintWifi);
      addEventListener('offline', paintWifi);
      function wifiPopover(anchor) {
        const c = navigator.connection;
        showPopover(anchor, `
          <h4>Wi-Fi</h4>
          <div class="row"><span>Status</span><b>${navigator.onLine ? 'Connected' : 'Offline'}</b></div>
          ${c?.effectiveType ? `<div class="row"><span>Connection</span><b>${c.effectiveType.toUpperCase()}</b></div>` : ''}
          ${c?.downlink ? `<div class="row"><span>Speed</span><b>~${c.downlink} Mbps</b></div>` : ''}
          ${c?.rtt ? `<div class="row"><span>Latency</span><b>${c.rtt} ms</b></div>` : ''}`);
      }

      // Sound: a volume slider and output list. The site plays no audio, so this only changes the icon.
      let volume = store.get('volume', 70);
      function paintSound() {
        const waves = document.querySelectorAll('.icon-sound .vol-waves path');
        waves.forEach((w, i) => (w.style.display = volume > i * 34 ? '' : 'none'));
        document.querySelectorAll('.icon-sound .vol-mute').forEach((m) => (m.style.display = volume === 0 ? '' : 'none'));
        const label = dockItem('sound')?.querySelector('.label');
        if (label) label.textContent = volume === 0 ? 'Sound · Muted' : `Sound · ${volume}%`;
      }
      function soundPopover(anchor) {
        const el = showPopover(anchor, `
          <h4>Sound</h4>
          <input class="vol-slider" type="range" min="0" max="100" value="${volume}" aria-label="Volume">
          <div class="bt-section">Output</div>
          <div class="sound-out on">✓ MacBook Pro Speakers</div>`);
        el?.querySelector('.vol-slider').addEventListener('input', (e) => {
          volume = Number(e.target.value);
          store.set('volume', volume);
          paintSound();
        });
      }

      function bluetoothPopover(anchor) {
        showPopover(anchor, `
          <h4>Bluetooth</h4>
          <div class="row"><span>Bluetooth</span><b>On</b></div>
          <div class="bt-section">Devices</div>
          <div class="bt-device">
            <span class="bt-dev-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M12 3c-3.3 0-6 2.7-6 6v6c0 3.3 2.7 6 6 6s6-2.7 6-6V9c0-3.3-2.7-6-6-6zm0 2.2v4.3" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/></svg>
            </span>
            <span><b>MX Master</b><span class="sub">Connected</span></span>
          </div>`);
      }

      // Weather: always Carolina Beach, NC, from Open-Meteo (no key, no visitor location needed).
      const WX_PLACE = { name: 'Carolina Beach, NC', lat: 34.04, lon: -77.89 };
      let weather = null;
      const WX = [[0, 'Clear'], [2, 'Partly cloudy'], [3, 'Overcast'], [48, 'Fog'], [57, 'Drizzle'], [67, 'Rain'], [77, 'Snow'], [82, 'Rain showers'], [86, 'Snow showers'], [99, 'Thunderstorm']];
      const wxText = (code) => (WX.find(([max]) => code <= max) || WX[WX.length - 1])[1];

      async function loadWeather() {
        try {
          const url = `https://api.open-meteo.com/v1/forecast?latitude=${WX_PLACE.lat}&longitude=${WX_PLACE.lon}` +
            '&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min&temperature_unit=fahrenheit&timezone=America%2FNew_York&forecast_days=1';
          const r = await (await fetch(url)).json();
          weather = {
            temp: Math.round(r.current.temperature_2m),
            text: wxText(r.current.weather_code),
            hi: Math.round(r.daily.temperature_2m_max[0]),
            lo: Math.round(r.daily.temperature_2m_min[0]),
          };
          document.querySelector('.icon-weather .wx-temp').textContent = weather.temp + '°';
          dockItem('weather').querySelector('.label').textContent = `${WX_PLACE.name} · ${weather.temp}°F ${weather.text}`;
        } catch {
          if (!weather) weather = { error: "Couldn't reach the weather service. Try again later." };
        }
        if (popoverOwner === dockItem('weather')) popover.innerHTML = weatherHTML();
      }

      function weatherHTML() {
        if (!weather) return `<h4>${WX_PLACE.name}</h4><div class="sub">Loading…</div>`;
        if (weather.error) return `<h4>${WX_PLACE.name}</h4><div class="sub">${esc(weather.error)}</div>`;
        return `<h4>${WX_PLACE.name}</h4><div class="big">${weather.temp}°F</div>
          <div class="sub">${weather.text} · H ${weather.hi}° L ${weather.lo}°</div>`;
      }
      function weatherPopover(anchor) { showPopover(anchor, weatherHTML()); }

      // ---------- Google Voice Tray (three tray icons + drawer) ----------
      // Demo data only: fictional names and 555 numbers.
      const gv = {
        threads: [
          { id: 't1', name: 'Alex Rivera', color: '#7c3aed', time: '10:41 AM', unread: true,
            msgs: [{ text: 'Did you see the new road.dance update?' }, { text: 'The map clusters look so good' }] },
          { id: 't2', name: '(910) 555-0142', color: '#0891b2', time: '9:15 AM', unread: true,
            msgs: [{ text: 'Your appointment is confirmed for Tue at 3:00 PM. Reply C to confirm.' }] },
          { id: 't3', name: 'Mom', color: '#db2777', time: 'Yesterday', unread: false,
            msgs: [{ text: 'Call me when you get a chance ❤️' }, { me: true, text: 'Will do!' }] },
          { id: 't4', name: 'Sam Carter', color: '#ea580c', time: 'Mon', unread: false,
            msgs: [{ me: true, text: 'Snowball fight rematch tonight?' }, { text: "You're on ❄️" }] },
        ],
        voicemails: [
          { id: 'v1', name: 'Dentist Office', number: '(910) 555-0188', time: '11:02 AM', secs: 24, unread: true,
            text: 'Hi, this is a reminder about your cleaning next Tuesday at three. Give us a call back if you need to reschedule.' },
          { id: 'v2', name: 'Alex Rivera', number: '(910) 555-0117', time: 'Yesterday', secs: 41, unread: false,
            text: "Hey, it's Alex. Call me back when you get this, I want to show you something I've been building." },
        ],
        calls: [
          { name: 'Mom', color: '#db2777', kind: 'in', time: 'Yesterday' },
          { name: '(910) 555-0142', color: '#0891b2', kind: 'missed', time: 'Mon' },
          { name: 'Sam Carter', color: '#ea580c', kind: 'out', time: 'Sun' },
        ],
        dms: [
          { id: 'c1', name: 'Jordan Lee', color: '#16a34a', time: '2:10 PM', unread: false,
            msgs: [{ text: 'pushed the fix, can you check?' }, { me: true, text: 'looks good 👍' }] },
          { id: 'c2', name: 'Taylor Kim', color: '#9333ea', time: 'Mon', unread: false, msgs: [{ text: 'lunch?' }] },
        ],
        spaces: [
          { id: 's1', name: 'firERP dev', color: '#dc2626', time: 'Tue', unread: false, msgs: [{ from: 'Jordan Lee', text: 'Raw Data view is live' }] },
          { id: 's2', name: 'Weekend Plans', color: '#0284c7', time: 'Sun', unread: false, msgs: [{ from: 'Sam Carter', text: 'pool at 8 🎱' }] },
        ],
        icons: { messages: true, voicemail: true, chat: true }, // the app's "Google ... icon" toggles
        autoOpen: false,
        open: null,      // 'voice' | 'chat' | null
        tab: 'messages', // messages | calls | voicemail
        thread: null,    // open conversation id
      };
      const gvCounts = () => ({
        messages: gv.threads.filter((t) => t.unread).length,
        voicemail: gv.voicemails.filter((v) => v.unread).length,
        chat: [...gv.dms, ...gv.spaces].filter((c) => c.unread).length,
      });
      const GVT_REPO = 'https://github.com/brysonwf/googlevoicetray';
      const GV_TRAYS = { messages: 'gv-messages', voicemail: 'gv-voicemail', chat: 'gv-chat' };
      const GV_TIPS = { messages: 'Google Voice - Messages', voicemail: 'Google Voice - Voicemail', chat: 'Google Chat' };

      function paintGvTrays() {
        const counts = gvCounts();
        for (const [key, id] of Object.entries(GV_TRAYS)) {
          const item = dockItem(id);
          if (!item) continue;
          item.hidden = !gv.icons[key];
          item.dataset.unread = counts[key] > 0;
          item.querySelector('.badge').textContent = counts[key] || '';
          item.querySelector('.label').textContent =
            counts[key] && key !== 'chat' ? `${GV_TIPS[key]}: ${counts[key]} unread` : GV_TIPS[key];
        }
      }

      const gvAvatar = (c) => `<span class="gv-avatar" style="background:${c.color}">${esc(c.name.replace(/[^A-Za-z]/, '')[0] || '#')}</span>`;
      const gvSnip = (c) => {
        const m = c.msgs[c.msgs.length - 1];
        return (m.me ? 'You: ' : m.from ? m.from.split(' ')[0] + ': ' : '') + m.text;
      };
      // A person's avatar color: theirs if they're a DM contact, otherwise picked from their name.
      const GC_COLORS = ['#16a34a', '#9333ea', '#ea580c', '#0891b2', '#db2777', '#4f46e5'];
      const gcPersonColor = (name) => [...gv.dms, ...gv.threads].find((c) => c.name === name)?.color
        || GC_COLORS[[...name].reduce((h, ch) => h + ch.charCodeAt(0), 0) % GC_COLORS.length];
      // Chat avatars: circles for people, rounded squares for Spaces.
      const gcAvatar = (c, space, small) =>
        `<span class="gc-avatar${space ? ' space' : ''}${small ? ' small' : ''}" style="background:${c.color}">${esc(c.name.replace(/[^A-Za-z]/, '')[0] || '#')}</span>`;
      const gvRow = (c) => `
        <button type="button" class="gv-row${c.unread ? ' unread' : ''}" data-thread="${c.id}">
          ${gvAvatar(c)}
          <span class="main"><span class="name"><span>${esc(c.name)}</span><time>${c.time}</time></span><span class="snip">${esc(gvSnip(c))}</span></span>
        </button>`;
      const gvFind = (id) => [...gv.threads, ...gv.dms, ...gv.spaces].find((c) => c.id === id);

      function gvScreen() {
        const chat = gv.open === 'chat';
        if (gv.thread && chat) {
          const c = gvFind(gv.thread);
          const space = gv.spaces.includes(c);
          return `
            <header class="gc-top">
              <button class="gv-icon-btn" data-act="back" aria-label="Back">←</button>
              ${gcAvatar(c, space)}
              <span class="gc-title">${esc(c.name)}<small>${space ? '3 members' : 'Active'}</small></span>
              <span class="gv-demo">Demo</span>
            </header>
            <div class="gv-body gc-messages">
              ${c.msgs.map((m) => m.me
                ? `<div class="gc-msg me"><div class="gc-bubble">${esc(m.text)}</div></div>`
                : `<div class="gc-msg">${gcAvatar(m.from ? { name: m.from, color: gcPersonColor(m.from) } : c, false, true)}<div><div class="gc-meta"><b>${esc(m.from || c.name)}</b> ${c.time}</div><div class="gc-text">${esc(m.text)}</div></div></div>`).join('')}
            </div>
            <form class="gv-compose gc-compose" data-act="send">
              <input type="text" placeholder="Message ${esc(c.name)}" aria-label="Message" autocomplete="off">
              <button type="submit" aria-label="Send">➤</button>
            </form>`;
        }
        if (gv.thread) {
          const c = gvFind(gv.thread);
          return `
            <header class="gv-top">
              <button class="gv-icon-btn" data-act="back" aria-label="Back">←</button>
              ${gvAvatar(c)}<h3>${esc(c.name)}</h3><span class="gv-demo">Demo</span>
            </header>
            <div class="gv-body"><div class="gv-thread">
              ${c.msgs.map((m) => `<div class="gv-bubble${m.me ? ' me' : ''}">${esc(m.text)}</div>`).join('')}
            </div></div>
            <form class="gv-compose" data-act="send">
              <input type="text" placeholder="${chat ? 'Message' : 'Text message'}" aria-label="Message" autocomplete="off">
              <button type="submit">Send</button>
            </form>`;
        }
        if (chat) {
          // Laid out like Google Chat on the web at phone width (which is how the app shows it).
          const row = (c, space) => `
            <button type="button" class="gc-row${c.unread ? ' unread' : ''}" data-thread="${c.id}">
              ${gcAvatar(c, space)}
              <span class="main"><span class="name"><span>${esc(c.name)}</span><time>${c.time}</time></span><span class="snip">${esc(gvSnip(c))}</span></span>
              ${c.unread ? '<i class="gc-dot"></i>' : ''}
            </button>`;
          return `
            <header class="gc-top">
              <button class="gv-icon-btn" aria-label="Main menu">☰</button>
              <span class="gc-search">⌕ <span>Search in chat</span></span>
              <span class="gc-me" aria-label="Your account">B</span>
            </header>
            <div class="gv-body gc-body">
              <button type="button" class="gc-new">✎ New chat</button>
              <div class="gc-nav"><span class="on">⌂ Home</span><span>@ Mentions</span><span>☆ Starred</span></div>
              <div class="gc-section">⌄ Chats</div>${gv.dms.map((c) => row(c, false)).join('')}
              <div class="gc-section">⌄ Spaces</div>${gv.spaces.map((c) => row(c, true)).join('')}
            </div>`;
        }
        const title = { messages: 'Messages', calls: 'Calls', voicemail: 'Voicemail' }[gv.tab];
        let body = '';
        if (gv.tab === 'messages') body = gv.threads.map(gvRow).join('');
        if (gv.tab === 'calls') {
          body = gv.calls.map((c) => `
            <div class="gv-row gv-call">${gvAvatar(c)}
              <span class="main"><span class="name"><span>${esc(c.name)}</span><time>${c.time}</time></span>
              <span class="snip${c.kind === 'missed' ? ' missed' : ''}">${{ in: '↙ Incoming call', out: '↗ Outgoing call', missed: '↙ Missed call' }[c.kind]}</span></span>
            </div>`).join('');
        }
        if (gv.tab === 'voicemail') {
          body = gv.voicemails.map((v) => `
            <div class="gv-vm${v.unread ? ' unread' : ''}" data-vm="${v.id}" style="--dur:${v.secs}s">
              <div class="top">${gvAvatar({ name: v.name, color: '#5f6368' })}
                <span class="who">${esc(v.name)}<small>${v.number} · ${v.time}</small></span>
              </div>
              <p>“${esc(v.text)}”</p>
              <div class="gv-player">
                <button class="gv-play" type="button" data-act="play" aria-label="Play voicemail">▶</button>
                <span class="gv-progress"><i></i></span><small>0:${String(v.secs).padStart(2, '0')}</small>
              </div>
            </div>`).join('');
        }
        const tab = (key, glyph, label) =>
          `<button type="button" data-tab="${key}" aria-current="${gv.tab === key}"><span>${glyph}</span>${label}</button>`;
        return `
          <header class="gv-top"><button class="gv-icon-btn" aria-label="Menu">☰</button><h3>${title}</h3><span class="gv-demo">Demo</span></header>
          <div class="gv-body">${body}</div>
          ${gv.tab === 'messages' ? '<button class="gv-fab" type="button">✎ Send a message</button>' : ''}
          <nav class="gv-tabs">${tab('calls', '☏', 'Calls')}${tab('messages', '✉', 'Messages')}${tab('voicemail', '⌕', 'Voicemail')}</nav>`;
      }

      let gvDrawer = null;
      function renderGv() {
        if (!gv.open) { gvDrawer?.remove(); gvDrawer = null; paintGvTrays(); return; }
        if (!gvDrawer) {
          gvDrawer = document.createElement('section');
          gvDrawer.setAttribute('role', 'dialog');
          gvDrawer.addEventListener('click', onGvClick);
          gvDrawer.addEventListener('submit', onGvSend);
          document.body.appendChild(gvDrawer);
        }
        gvDrawer.className = `gv-drawer${gv.open === 'chat' ? ' chat' : ''}`;
        gvDrawer.setAttribute('aria-label', gv.open === 'chat' ? 'Google Chat (demo)' : 'Google Voice (demo)');
        gvDrawer.innerHTML = gvScreen();
        // Every demo screen points to the real app.
        gvDrawer.querySelector('.gv-top, .gc-top').insertAdjacentHTML('afterend', `
          <a class="gv-get" href="${GVT_REPO}" target="_blank" rel="noreferrer">
            <span>This is a demo of <b>Google Voice Tray</b>, a free Windows app.</span><span class="go">Get it on GitHub ↗</span>
          </a>`);
        const body = gvDrawer.querySelector('.gv-body');
        if (gv.thread) body.scrollTop = body.scrollHeight;
        paintGvTrays();
      }

      // Same behaviour as the app: clicking a tray icon toggles its window and jumps to that tab.
      function gvToggle(which) {
        const target = which === 'chat' ? 'chat' : 'voice';
        const sameView = gv.open === target && (target === 'chat' || gv.tab === which);
        closePopover();
        if (sameView) { gv.open = null; return renderGv(); }
        gv.open = target;
        gv.thread = null;
        if (target === 'voice') gv.tab = which;
        renderGv();
      }

      function onGvClick(e) {
        const t = e.target;
        const tab = t.closest('[data-tab]');
        if (tab) { gv.tab = tab.dataset.tab; gv.thread = null; return renderGv(); }
        if (t.closest('[data-act="back"]')) { gv.thread = null; return renderGv(); }
        const row = t.closest('[data-thread]');
        if (row) { gv.thread = row.dataset.thread; gvFind(gv.thread).unread = false; return renderGv(); }
        if (t.closest('[data-act="play"]')) {
          const card = t.closest('[data-vm]');
          const vm = gv.voicemails.find((v) => v.id === card.dataset.vm);
          vm.unread = false;
          card.classList.remove('unread');
          card.classList.toggle('playing');
          t.textContent = card.classList.contains('playing') ? '❚❚' : '▶';
          paintGvTrays();
        }
      }

      function onGvSend(e) {
        e.preventDefault();
        const input = e.target.querySelector('input');
        const text = input.value.trim();
        if (!text) return;
        const c = gvFind(gv.thread);
        c.msgs.push({ me: true, text });
        c.time = 'Now';
        renderGv();
        gvDrawer.querySelector('.gv-compose input')?.focus();
      }

      // Simulated incoming messages so the icons visibly flip from grey to green.
      function gvIncoming(list, id, text, kind) {
        const c = list.find((x) => x.id === id);
        c.msgs.push({ text });
        c.unread = true;
        c.time = 'Now';
        list.splice(list.indexOf(c), 1);
        list.unshift(c);
        if (kind === 'messages' && gv.autoOpen && !gv.open) { gv.open = 'voice'; gv.tab = 'messages'; gv.thread = null; }
        renderGv();
        bounce(GV_TRAYS[kind]);
      }
      setTimeout(() => gvIncoming(gv.dms, 'c1', 'are you around? 👀', 'chat'), 45000);
      let gvPinged = false;
      setInterval(() => {
        if (!gvPinged && gvCounts().messages === 0) {
          gvPinged = true;
          setTimeout(() => gvIncoming(gv.threads, 't4', 'pool later? 🎱', 'messages'), 15000);
        }
      }, 1000);

      // Right-click menu, mirroring the app's tray context menu.
      function gvContextMenu(anchor, which) {
        const enabled = Object.values(gv.icons).filter(Boolean).length;
        const check = (on) => (on ? '✓ ' : '  ');
        const items = [
          { key: 'open', label: { messages: 'Open Messages', voicemail: 'Open Voicemail', chat: 'Open Google Chat' }[which], action: true },
          ...(which === 'chat' ? [] : [{ key: 'auto', label: check(gv.autoOpen) + 'Auto-open on new messages', action: true }]),
          '-',
          { key: 'icon:voicemail', label: check(gv.icons.voicemail) + 'Google Voice icon', action: !(gv.icons.voicemail && enabled === 1) },
          { key: 'icon:messages', label: check(gv.icons.messages) + 'Google Messages icon', action: !(gv.icons.messages && enabled === 1) },
          { key: 'icon:chat', label: check(gv.icons.chat) + 'Google Chat icon', action: !(gv.icons.chat && enabled === 1) },
          '-',
          { key: 'get', label: 'Get Google Voice Tray on GitHub…', action: true },
          { key: 'about', label: 'About Google Voice Tray…', action: true },
          { key: 'quit', label: 'Quit App', action: true },
        ];
        const el = showPopover(anchor, `<div role="menu" aria-label="Google Voice Tray menu">${menuHTML(items)}</div>`, { className: 'menu' });
        el?.addEventListener('click', (e) => {
          const btn = e.target.closest('.menu-item');
          if (!btn || btn.getAttribute('aria-disabled') === 'true') return;
          const act = btn.dataset.action;
          closePopover();
          if (act === 'open') { if (!(gv.open && (which === 'chat' ? gv.open === 'chat' : gv.open === 'voice' && gv.tab === which))) gvToggle(which); }
          else if (act === 'auto') gv.autoOpen = !gv.autoOpen;
          else if (act.startsWith('icon:')) { gv.icons[act.slice(5)] = !gv.icons[act.slice(5)]; paintGvTrays(); }
          else if (act === 'get') window.open(GVT_REPO, '_blank', 'noreferrer');
          else if (act === 'about') openProject('googlevoicetray');
          else if (act === 'quit') {
            gv.open = null;

      // ---------- Calculator (confidently wrong) ----------
      const BS = [
        () => '42',
        (r) => String(r).split('').reverse().join('').replace(/^-|-(?=.)/, '') || '0',
        () => 'a lot',
        () => '≈ 7ish',
        (r) => String(Math.round(r) + 1),

        (r) => String(Math.round(r * 1.1 + 3)),
        () => 'ask again later',
        () => '0.99999…',
        () => 'purple',
      ];
      const CONFIDENCE = ['Confidence: 100%', 'Checked twice', 'Peer reviewed', 'Certified correct', 'Source: vibes', 'Rounded for clarity'];

      function openCalculator() {
        const el = openWindow({
          id: 'calculator',
          title: 'Calculator',
          resizable: false,
          body: `
            <div class="calc" data-drag>
              <div class="screen-out"><div class="expr"></div><div class="val">0</div><div class="conf"></div></div>
              <div class="keys">
                <button class="fn" data-k="C">AC</button><button class="fn" data-k="±">±</button><button class="fn" data-k="%">%</button><button class="op" data-k="/">÷</button>
                <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button><button class="op" data-k="*">×</button>
                <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button><button class="op" data-k="-">−</button>
                <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button><button class="op" data-k="+">+</button>
                <button class="zero" data-k="0">0</button><button data-k=".">.</button><button class="op" data-k="=">=</button>
              </div>
            </div>`,
        });
        if (!el) return;
        el.classList.add('dark', 'calc-window');
        let expr = '';
        let cur = '0';
        let fresh = true;
        const paint = (val, conf = '') => {
          el.querySelector('.expr').textContent = expr.replace(/\*/g, '×').replace(/\//g, '÷');
          const v = el.querySelector('.val');
          v.textContent = val;
          v.style.fontSize = val.length > 14 ? '20px' : val.length > 9 ? '28px' : '';
          el.querySelector('.conf').textContent = conf;
        };
        const press = (k) => {
          if (/[0-9]/.test(k)) { cur = fresh || cur === '0' ? k : cur + k; fresh = false; return paint(cur); }
          if (k === '.') { if (fresh) { cur = '0.'; fresh = false; } else if (!cur.includes('.')) cur += '.'; return paint(cur); }
          if (k === 'C') { expr = ''; cur = '0'; fresh = true; return paint(cur); }
          if (k === '±') { cur = cur.startsWith('-') ? cur.slice(1) : '-' + cur; return paint(cur); }
          if (k === '%') { cur = String(parseFloat(cur) / 100); return paint(cur); }
          if ('+-*/'.includes(k)) { expr += cur + k; fresh = true; return paint(cur); }
          if (k === '=') {
            const full = expr + cur;
            let real = 0;
            try { real = Function(`"use strict";return (${full.replace(/[^-+*/.0-9()]/g, '').replace(/--/g, '- -')})`)(); } catch {}
            if (!isFinite(real)) real = 0;
            const answer = BS[Math.floor(Math.random() * BS.length)](Math.round(real * 1000) / 1000);
            expr = full + ' =';
            paint(answer, CONFIDENCE[Math.floor(Math.random() * CONFIDENCE.length)]);
            expr = '';
            cur = '0';
            fresh = true;
          }
        };
        el.addEventListener('click', (e) => { const b = e.target.closest('[data-k]'); if (b) press(b.dataset.k); });
        el.calcKey = (key) => {
          const map = { Enter: '=', Escape: 'C', Backspace: 'C', x: '*', X: '*' };
          const k = map[key] || key;
          if (/^[0-9.+\-*/=%]$/.test(k) || k === 'C') { press(k); return true; }
          return false;
        };
      }

      // ---------- Desktop document: the menu bar critique ----------
      function openMenubarDoc() {
        openWindow({
          id: 'menubar-doc',
          title: 'The Menu Bar Problem.doc',
          body: `
            <article class="doc">
              <div class="kicker">Design critique</div>
              <h1>The macOS menu bar is a waste of space</h1>
              <p class="byline">Bryson · altbryson · October 2026</p>

              <p>The menu bar has sat across the top of every Mac screen since 1984. It made sense on a 9-inch display that ran one app at a time. On today's large displays, multi-monitor setups, and notched laptops, it costs more than it gives back. This desktop doesn't have one, and it doesn't miss it.</p>

              <h2>1. It takes space from every app, all the time</h2>
              <p>The bar takes a permanent strip off the top of every display, and on notched MacBooks it gets taller to clear the camera housing. Widescreen displays are already short on vertical space, and that's exactly the space documents, code and timelines need.</p>

              <h2>2. The menu is far from the window it controls</h2>
              <p>The standard defense is Fitts's law: a target at the screen edge is infinitely tall, so it's easy to hit. That held on a 9-inch screen. On a 27-inch display, or with a window on a second monitor, the mouse has to travel across the screen to reach menus for a window that's somewhere else. A big, easy target doesn't help when it's that far away.</p>

              <h2>3. The menus change depending on which window has focus</h2>
              <ul>
                <li>The menus at the top change based on focus, not on what you're looking at. Click the desktop by accident and the menus quietly switch to Finder's.</li>
                <li>A window can be in front of you while the menu bar belongs to a different app. New users read the bar as part of whatever window is visible. It isn't.</li>
                <li>With several displays, the active menu is often on a different screen from the window you're working in.</li>
              </ul>

              <h2>4. The notch hides status icons</h2>
              <p>On notched MacBooks, status icons that don't fit are hidden behind the camera housing. Nothing tells you they're there, and they can't be clicked. Install a few utilities and some icons silently disappear.</p>

              <h2>5. Status icons pile up with no order</h2>
              <p>Every utility adds its own monochrome icon to the same strip. There's no grouping, no priority, and very little room. Some icons give live information, some open menus, and some exist only to remind you an app is running. They all look about the same.</p>

              <h2>6. It hides commands instead of showing them</h2>
              <p>Most people never open the menus. They use toolbars, right-click and keyboard shortcuts. The most useful thing in the menu bar is Help → Search, which works around the menus instead of through them.</p>

              <h2>7. It gets in the way in full screen</h2>
              <p>In full-screen apps the bar hides, then drops down over your content whenever the pointer goes near the top edge. Toolbars, tabs and close buttons up there get covered.</p>

              <div class="pull">The best menu bar is the one you can't see, because everything it did now lives somewhere you already look.</div>

              <h2>What this desktop does instead</h2>
              <ul>
                <li><b>System menu in the Dock.</b> The altbryson icon opens the full system menu: About, Settings, Recent Items, Sleep, Restart, Shut Down and Lock Screen.</li>
                <li><b>Status icons are real Dock icons.</b> Weather, Bluetooth, battery, Wi-Fi, search, settings and the clock are full-size, readable and show live information. The clock really ticks, and the battery shows its actual level.</li>
                <li><b>Background apps sit with the system icons.</b> Google Voice Tray's three icons sit with the status items, show unread badges, and have right-click menus.</li>
                <li><b>Controls stay in the window.</b> Each window carries its own close button, title and actions, right where you're working.</li>
                <li><b>The full height is yours.</b> Nothing is pinned to the top edge, so windows get the whole screen.</li>
              </ul>
              <p>One bar at the bottom, where your eyes and pointer already go to switch apps, does the job of two.</p>
            </article>`,
        });
      }

      // Documents and links sit in a grid that fills from the top-right, column by column, wrapping
      // when the screen is short. Drag an item to move it; it snaps to the nearest cell (swapping with
      // whatever is there), and the layout is remembered per browser.
      const DESK_DOCS = [
        { id: 'claude-doc', name: 'Built with Claude.doc', ext: 'doc', mark: 'claude', open: openClaudeDoc },
        { id: 'resume', name: "Bryson Faggart's Resume.pdf", ext: 'pdf', open: openResume },

        { id: 'link-linkedin', name: 'LinkedIn', icon: 'linkedin', url: 'https://www.linkedin.com/in/brysonwf/' },
        { id: 'link-x', name: 'X @brysonwf', icon: 'x', url: 'https://x.com/brysonwf' },
        { id: 'link-x-brysonf', name: 'X @brysonf', icon: 'x', url: 'https://x.com/brysonf' },
        { id: 'link-github', name: 'GitHub', icon: 'github', url: 'https://github.com/brysonwf' },
        { id: 'trash', name: 'Trash', icon: 'trash', open: openTrash },
      ];
      // Mac-sized cells on a computer; on a phone, a 4-column grid of iPhone-sized (60px) icons like the home screen.
      const PHONE_GRID = matchMedia('(max-width: 600px)');
      let CELL_W, CELL_H, GRID_PAD;
      function sizeGrid() {
        if (PHONE_GRID.matches) { GRID_PAD = 16; CELL_W = (desktop.clientWidth - GRID_PAD * 2) / 4; CELL_H = 96; }
        else { GRID_PAD = 24; CELL_W = 134; CELL_H = 140; }
        deskIcons.style.setProperty('--cell-w', CELL_W + 'px');
      }
      const deskIcons = $('desk-icons');
      let deskLayout = store.get('deskLayout', {}); // id -> { col, row }; col 0 is the rightmost column

      function gridRows() {
        const usable = desktop.clientHeight - dockH() - GRID_PAD * 2;
        return Math.max(1, Math.floor(usable / CELL_H));
      }
      function gridCols() {
        return Math.max(1, Math.floor((desktop.clientWidth - GRID_PAD * 2) / CELL_W + 0.001));
      }
      const cellKey = (c) => `${c.col},${c.row}`;

      // Keep saved positions that still fit; place everything else in the first free cells.
      function layoutDesk() {
        sizeGrid();
        const rows = gridRows(), cols = gridCols();
        const taken = new Set();
        const pos = {};
        for (const d of DESK_DOCS) {
          const p = deskLayout[d.id];
          if (p && p.row < rows && p.col < cols && !taken.has(cellKey(p))) { pos[d.id] = p; taken.add(cellKey(p)); }
        }
        let next = 0;
        for (const d of DESK_DOCS) {
          if (pos[d.id]) continue;
          let c;
          // A Mac fills from the top right, column by column; an iPhone fills from the top left, row by row.
          do {
            c = PHONE_GRID.matches ? { col: cols - 1 - (next % cols), row: Math.floor(next / cols) } : { col: Math.floor(next / rows), row: next % rows };
            next++;
          } while (taken.has(cellKey(c)));
          pos[d.id] = c;
          taken.add(cellKey(c));
        }
        for (const d of DESK_DOCS) placeIcon(deskIcons.querySelector(`[data-id="${d.id}"]`), pos[d.id]);
        return pos;
      }
      function placeIcon(el, { col, row }) {
        el.style.left = desktop.clientWidth - GRID_PAD - (col + 1) * CELL_W + 'px';
        el.style.top = GRID_PAD + row * CELL_H + 'px';
      }

      function makeDeskDraggable(el, id) {
        el.addEventListener('pointerdown', (e) => {
          if (e.button !== 0) return;
          const startX = e.clientX, startY = e.clientY;
          const origin = { left: el.offsetLeft, top: el.offsetTop };
          let dragging = false;
          const move = (ev) => {
            const dx = ev.clientX - startX, dy = ev.clientY - startY;
            if (!dragging && Math.hypot(dx, dy) < 5) return;
            if (!dragging) { dragging = true; el.classList.add('dragging'); el.setPointerCapture(ev.pointerId); }
            el.style.left = origin.left + dx + 'px';
            el.style.top = origin.top + dy + 'px';
          };
          const up = () => {
            el.removeEventListener('pointermove', move);
            el.removeEventListener('pointerup', up);
            el.removeEventListener('pointercancel', up);
            if (!dragging) return;
            el.classList.remove('dragging');
            el.dataset.justDragged = '1'; // swallow the click that follows a drag
            setTimeout(() => delete el.dataset.justDragged, 0);
            // Snap to the nearest cell, swapping with whatever is there.
            const col = Math.min(gridCols() - 1, Math.max(0, Math.round((desktop.clientWidth - GRID_PAD - el.offsetLeft) / CELL_W - 1)));
            const row = Math.min(gridRows() - 1, Math.max(0, Math.round((el.offsetTop - GRID_PAD) / CELL_H)));
            const current = layoutDesk();
            const from = current[id];
            const occupant = Object.keys(current).find((k) => k !== id && current[k].col === col && current[k].row === row);
            const next = { ...current, [id]: { col, row } };
            if (occupant) next[occupant] = from;
            deskLayout = next;
            store.set('deskLayout', deskLayout);
            layoutDesk();
          };
          el.addEventListener('pointermove', move);
          el.addEventListener('pointerup', up);
          el.addEventListener('pointercancel', up);
        });
      }

      DESK_DOCS.forEach((d) => {
        const el = document.createElement(d.url ? 'a' : 'button');
        el.className = `desk-icon${d.url ? ' desk-link' : ''}`;
        el.dataset.id = d.id;
        if (d.url) {

              <div class="kicker">Credits</div>
              <h1>Designed &amp; built with Claude</h1>
              <p>This desktop, from the dock and the draggable windows to the confidently wrong calculator, was designed and coded with Claude Code, Anthropic's AI coding agent, working from a conversation with Bryson.</p>
              <a class="btn" href="https://claude.com/claude-code" target="_blank" rel="noreferrer">About Claude Code ↗</a>
            </article>`,
        });
      }

      // ---------- Spotlight ----------
      function openSpotlight() {
        if (document.querySelector('.spotlight-backdrop')) return;
        closePopover();
        const entries = [
          ...PROJECTS.map((p) => ({ name: p.name, kind: p.platform, icon: p.id, run: () => openProject(p.id) })),
          { name: 'About altbryson', kind: 'System', icon: 'altbryson', run: openAbout },
          { name: 'System Settings', kind: 'System', icon: 'settings', run: openSettings },
          { name: 'Calculator', kind: 'Utility', icon: 'calculator', run: openCalculator },
          { name: 'Terminal', kind: 'Utility', icon: 'terminal', run: openTerminal },
          { name: 'Trash', kind: 'System', icon: 'trash', run: openTrash },
          { name: 'The Menu Bar Problem.doc', kind: 'Document', icon: 'altbryson', run: openMenubarDoc },
          { name: 'Legal Disclaimer.txt', kind: 'Document', icon: 'altbryson', run: openDisclaimer },
          { name: "Bryson Faggart's Resume.pdf", kind: 'Document', icon: 'altbryson', run: openResume },
          { name: 'SketchUp Samples.skp', kind: 'Document', icon: 'altbryson', run: openSketchup },
          { name: 'Built with Claude.doc', kind: 'Document', icon: 'claude', run: openClaudeDoc },
          { name: 'Messages', kind: 'Google Voice Tray', icon: 'gv-messages', run: () => gvToggle('messages') },
          { name: 'Voicemail', kind: 'Google Voice Tray', icon: 'gv-voicemail', run: () => gvToggle('voicemail') },
          { name: 'Google Chat', kind: 'Google Voice Tray', icon: 'gv-chat', run: () => gvToggle('chat') },
          { name: 'LinkedIn', kind: 'Link', icon: 'linkedin', run: () => window.open('https://www.linkedin.com/in/brysonwf/', '_blank', 'noreferrer') },
          { name: 'X @brysonwf', kind: 'Link', icon: 'x', run: () => window.open('https://x.com/brysonwf', '_blank', 'noreferrer') },
          { name: 'X @brysonf', kind: 'Link', icon: 'x', run: () => window.open('https://x.com/brysonf', '_blank', 'noreferrer') },
          { name: 'GitHub', kind: 'Link', icon: 'github', run: () => window.open('https://github.com/brysonwf', '_blank', 'noreferrer') },
        ];
        const back = document.createElement('div');
        back.className = 'spotlight-backdrop';
        back.innerHTML = `
          <div class="spotlight" role="dialog" aria-label="Spotlight Search">
            <input type="text" placeholder="Spotlight Search" aria-label="Search" autocomplete="off">
            <ul role="listbox"></ul>
          </div>`;
        document.body.appendChild(back);
        const input = back.querySelector('input');
        const list = back.querySelector('ul');
        let matches = [];
        let sel = 0;
        const render = () => {
          const q = input.value.trim().toLowerCase();
          matches = entries.filter((e) => !q || e.name.toLowerCase().includes(q) || e.kind.toLowerCase().includes(q));
          sel = Math.min(sel, Math.max(0, matches.length - 1));
          list.innerHTML = matches.map((m, i) =>
            `<li role="option" data-i="${i}" aria-selected="${i === sel}">${iconHTML(m.icon)}<span>${m.name}</span><small>${m.kind}</small></li>`).join('');
        };
        const close = () => back.remove();
        const run = (i) => { const m = matches[i]; close(); m?.run(); };
        input.addEventListener('input', () => { sel = 0; render(); });
        input.addEventListener('keydown', (e) => {
          if (e.key === 'ArrowDown') { sel = Math.min(sel + 1, matches.length - 1); render(); e.preventDefault(); }
          if (e.key === 'ArrowUp') { sel = Math.max(sel - 1, 0); render(); e.preventDefault(); }
          if (e.key === 'Enter') run(sel);
          if (e.key === 'Escape') { close(); e.stopPropagation(); }
        });
        list.addEventListener('click', (e) => { const li = e.target.closest('li'); if (li) run(+li.dataset.i); });
        back.addEventListener('pointerdown', (e) => { if (e.target === back) close(); });
        render();
        input.focus();
      }

      // ---------- Dock ----------
      const DOCK = [
        { id: 'altbryson', name: 'altbryson', run: (el) => openSystemMenu(el) },
        { id: 'terminal', name: 'Terminal', run: openTerminal },
        { id: 'calculator', name: 'Calculator', run: openCalculator },
        '|',
        // Web apps open straight into a new Baseless tab; Baseless itself opens its window.
        ...PROJECTS.filter((p) => p.device !== 'windows').map((p) => ({ id: p.id, name: p.name, stage: p.stage, run: () => (p.device === 'phone' ? openInBaseless(p.url) : openProject(p.id)) })),
        '|',
        { id: 'gv-messages', name: 'Google Voice - Messages', run: () => gvToggle('messages'), menu: (el) => gvContextMenu(el, 'messages'), badge: true, tray: true },
        { id: 'gv-voicemail', name: 'Google Voice - Voicemail', run: () => gvToggle('voicemail'), menu: (el) => gvContextMenu(el, 'voicemail'), badge: true, tray: true },
        { id: 'gv-chat', name: 'Google Chat', run: () => gvToggle('chat'), menu: (el) => gvContextMenu(el, 'chat'), badge: true, tray: true, compact: true },
        { id: 'weather', name: 'Weather', run: weatherPopover, tray: true, compact: true },
        { id: 'bluetooth', name: 'Bluetooth', run: bluetoothPopover, tray: true },
        { id: 'battery', name: 'Battery', run: batteryPopover, tray: true },
        { id: 'wifi', name: 'Wi-Fi', run: wifiPopover, tray: true },
        { id: 'sound', name: 'Sound', run: soundPopover, tray: true },
        { id: 'search', name: 'Spotlight Search', run: openSpotlight, tray: true },
        { id: 'settings', name: 'System Settings', run: openSettings, tray: true, compact: true },
        { id: 'clock', name: 'Clock', run: clockPopover },
      ];

      DOCK.forEach((d) => {
        if (d === '|') {
          const sep = document.createElement('span');
          sep.className = 'divider';
          dock.appendChild(sep);
          return;
        }
        const el = document.createElement(d.href ? 'a' : 'button');
        el.className = d.tray ? `dock-item tray-item${d.compact ? ' compact-keep' : ''}` : 'dock-item';
        el.dataset.id = d.id;
        el.setAttribute('aria-label', d.name);
        if (d.href) {
          el.href = d.href;
          el.target = '_blank';
          el.rel = 'noreferrer';
        } else {
          el.type = 'button';
          el.addEventListener('click', () => d.run(el));
        }
        // Tray slots are as wide as their glyph (rendered at 60/h scale, then the 1.2x CSS scale) plus a fixed margin.
        if (TRAY_FIT[d.id]) {
          const [h, , , w] = TRAY_FIT[d.id];
          el.style.setProperty('--w', ((w * 60 / h / 100) * 1.2 + 0.32).toFixed(3));
        }
        if (d.menu) el.addEventListener('contextmenu', (e) => { e.preventDefault(); d.menu(el); });
        el.innerHTML = iconHTML(d.id) + (d.badge ? '<span class="badge"></span>' : '') + (d.stage ? `<span class="badge stage" title="${d.stage}">${d.stage === 'alpha' ? 'α' : 'β'}</span>` : '') + `<span class="label">${d.name}${d.stage ? ` (${d.stage})` : ''}</span>`;
        dock.appendChild(el);
      });

      // macOS-style magnification for mouse/trackpad users.
      if (matchMedia('(hover: hover) and (pointer: fine)').matches &&
          !matchMedia('(prefers-reduced-motion: reduce)').matches) {
        const items = [...dock.querySelectorAll('.dock-item')];
        dock.addEventListener('mousemove', (e) => {
          if (!settings.magnify || matchMedia('(max-width: 1000px)').matches) return;
          // Magnifying adds roughly amp x 150px of width; never let that push the dock off-screen.
          if (!dock.classList.contains('magnifying')) dock.dataset.slack = innerWidth - 16 - dock.getBoundingClientRect().width;
          const amp = Math.max(0, Math.min(0.55, (dock.dataset.slack * 0.9) / 150));
          dock.classList.add('magnifying');
          items.forEach((el) => {
            const r = el.getBoundingClientRect();
            const dist = Math.abs(e.clientX - (r.left + r.width / 2));
            const scale = 1 + amp * Math.max(0, 1 - dist / 150);
            el.style.width = `calc(var(--size) * var(--w, 1) * ${scale.toFixed(3)})`;
          });
        });
        dock.addEventListener('mouseleave', () => {
          dock.classList.remove('magnifying');
          items.forEach((el) => (el.style.width = ''));
        });
      }

      // ---------- Keyboard ----------
      document.addEventListener('keydown', (e) => {
        if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); openSpotlight(); return; }
        const focused = [...windows.entries()].find(([, el]) => el.classList.contains('focused'));
        const typing = e.target.closest('input, textarea');
        if (focused?.[0] === 'calculator' && !typing && !e.metaKey && !e.ctrlKey && e.key !== 'Escape') {
          if (focused[1].calcKey(e.key)) e.preventDefault();
          return;
        }
        if (e.key !== 'Escape') return;
        if (popover) return closePopover();
        if (gv.open && (!focused || typing?.closest('.gv-drawer'))) { gv.open = null; return renderGv(); }
        if (focused) closeWindow(focused[0]);
      });

      window.addEventListener('resize', () => {
        closePopover();
        windows.forEach((el) => (el.classList.contains('fullscreen') ? fitFullScreen(el) : clamp(el)));
      });
      window.addEventListener('hashchange', () => openProject(location.hash.slice(1)));

      updateClock();
      setInterval(updateClock, 1000);
      paintWifi();
      paintBattery();
      paintSound();
      paintGvTrays();
      paintTrashIcon();
      loadWeather();
      setInterval(loadWeather, 15 * 60 * 1000);
      // Baseless Chat (the desktop's browser) opens on arrival, unless the link names another project.
      openProject(projectById(location.hash.slice(1)) ? location.hash.slice(1) : 'baseless');
    </script>
